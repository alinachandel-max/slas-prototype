name: Recover SLAS Pages deployment
on:
  push:
    branches: [codex/slas-pages-recovery-20261101]
    paths: [.github/workflows/recover-slas-pages.yml]
permissions:
  pages: write
jobs:
  recover:
    if: github.repository == 'alinachandel-max/slas-prototype'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel the stale deployment and request the latest main build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          pages_api="https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
          old_deployment="0118aa499e0319abdb77111a1c4274934f794f12"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$pages_api/deployments/$old_deployment" -o "$RUNNER_TEMP/slas-pages-status.json"
          cat "$RUNNER_TEMP/slas-pages-status.json"
          cancel_code=$(curl --silent --show-error -o "$RUNNER_TEMP/slas-pages-cancel.json" -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$pages_api/deployments/$old_deployment/cancel")
          echo "Pages cancel HTTP status: $cancel_code"
          if [ "$cancel_code" = 400 ] && python3 -c 'import json,sys; sys.exit(json.load(open(sys.argv[1])).get("status") != "succeed")' "$RUNNER_TEMP/slas-pages-status.json"; then
            echo "The previous deployment has already finished."
          elif [ "$cancel_code" != 204 ] && [ "$cancel_code" != 404 ]; then
            cat "$RUNNER_TEMP/slas-pages-cancel.json"
            exit 1
          fi
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$pages_api/builds"
