:root {
  font-family: Manrope, sans-serif;
  color: #292929;
  background: #fff;
  color-scheme: light;
  font-synthesis: none;
  --brand: #038725;
  --muted: #858b91;
  --subtle: #f4f4f5;
  --border: #e5e5e6;
  --error: #b42318;
  --focus: #027b22;
}

* { box-sizing: border-box; }
html { min-width: 280px; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #fff; }
button, input, select, textarea { font: inherit; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
button, input, select, textarea { min-width: 0; }
button, input, select, textarea, a { outline: none; }
button:focus-visible, a:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}
img { display: block; max-width: 100%; }
button img { pointer-events: none; flex-shrink: 0; }
a { color: var(--brand); text-decoration: none; }
[hidden] { display: none !important; }

.app {
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 390px;
  min-height: 100vh;
  min-height: 100svh;
  margin-inline: auto;
  background: #fff;
  isolation: isolate;
}

.topbar {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr) 32px;
  align-items: center;
  gap: 8px;
  flex: none;
  padding: calc(24px + env(safe-area-inset-top, 0px)) 16px 0;
  min-height: calc(64px + env(safe-area-inset-top, 0px));
}
.icon-button {
  display: grid;
  place-items: center;
  width: 32px;
  height: 40px;
  padding: 4px;
  border: 0;
  border-radius: 8px;
  color: #292929;
  background: transparent;
}
.icon-button img { width: 24px; height: 24px; object-fit: contain; }
.topbar > .icon-button:first-child { margin-left: -4px; }
.topbar > .icon-button:last-child { justify-self: end; margin-right: -4px; }
.icon-button:active, .help-button:active { background: #f4f4f5; }
.topbar-title, .bar-title { margin: 0; text-align: center; font-size: 16px; font-weight: 600; line-height: 24px; }
.topbar > .close-icon { grid-column: 3; }
.close-icon { position: relative; color: #aeb2b6; }
.close-icon::before, .close-icon::after {
  content: '';
  position: absolute;
  left: 6px;
  top: 19px;
  width: 21px;
  height: 2px;
  border-radius: 2px;
  background: currentColor;
  transform: rotate(45deg);
}
.close-icon::after { transform: rotate(-45deg); }
.registration-bar {
  min-height: calc(52px + env(safe-area-inset-top, 0px));
  padding-top: calc(6px + env(safe-area-inset-top, 0px));
  padding-bottom: 5px;
  border-bottom: 1px solid #ededed;
}
.registration-bar > :nth-child(2) {
  text-align: center;
  font-size: 16px;
  line-height: 24px;
  font-weight: 600;
}
.progress { width: 100%; min-width: 0; text-align: center; }
.progress-track {
  display: flex;
  gap: 4px;
  width: 166px;
  max-width: 100%;
  margin: 0 auto;
}
.progress-track i { display: block; flex: 1; height: 4px; border-radius: 3px; background: #f1f1f1; }
.progress-track i.is-complete { background: var(--brand); }
.progress-caption { display: block; margin: 10px 0 0; color: #808080; font-size: 12px; font-weight: 500; line-height: 18px; white-space: nowrap; }

.screen {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-width: 0;
  margin: 0;
  padding: 8px 16px max(32px, env(safe-area-inset-bottom, 0px));
  animation: screen-enter 160ms ease-out both;
}
.registration-bar + .screen { padding-top: 32px; }
.screen-body { display: flex; flex: 1; flex-direction: column; min-width: 0; }
.screen-heading { flex: none; margin-bottom: 40px; text-align: center; }
.screen-heading h1 {
  margin: 0;
  color: #292929;
  font-size: 28px;
  font-weight: 700;
  line-height: 1.4;
  letter-spacing: 0;
  overflow-wrap: normal;
}
.screen-heading h1:focus { outline: none; }
.registration-bar + .screen .screen-heading h1 { font-size: 24px; line-height: 1.4; }

.dialog-body a { text-decoration: underline; text-underline-offset: 3px; }
.dialog-body .record-list { gap: 18px; }
.details-sections { display: flex; flex-direction: column; gap: 24px; }
.details-sections section { min-width: 0; }
.details-sections h3 { margin: 0 0 8px; font-size: 16px; font-weight: 700; line-height: 24px; }
.details-sections p { margin: 0 0 8px; color: #696969; overflow-wrap: anywhere; }
.dialog-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 24px; }
.dialog-actions .button { min-height: 48px; padding-block: 10px; font-size: 16px; line-height: 24px; }
.toast {
  position: fixed;
  z-index: 20;
  left: 50%;
  bottom: max(24px, env(safe-area-inset-bottom, 0px));
  width: max-content;
  max-width: min(358px, calc(100vw - 32px));
  margin: 0;
  padding: 12px 16px;
  border-radius: 14px;
  color: #fff;
  background: #292929;
  font-size: 14px;
  font-weight: 500;
  line-height: 22px;
  text-align: center;
  transform: translateX(-50%);
}
.visually-hidden {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  margin: -1px !important;
  padding: 0 !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}
.spinner { display: inline-block; flex: 0 0 18px; width: 18px; height: 18px; animation: spin 800ms linear infinite; }
.spinner:not(img) { border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; }
.button[aria-busy="true"] { cursor: wait; }
[aria-busy="true"] .button { pointer-events: none; }

@keyframes screen-enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 359px) {
  .topbar { column-gap: 4px; }
  .progress-caption { font-size: 11px; }
  .progress-track { width: 154px; }
  .screen-heading h1 { font-size: 26px; }
  .button { padding-inline: 12px; font-size: 17px; }
  .record-row { gap: 12px; }
  .terms-list > div { gap: 8px; }
  .terms-list dt, .terms-list dd { font-size: 13px; }
  .loan-illustration { width: 76px; }
  .loan-monthly { font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; }
  .screen { animation: none; }
  .button { transition: none; }
  .spinner { animation: none; }
}

  function openDialog(title, body, actions) {

  function field(name, label, options = {}) {
    const value = options.value !== undefined ? options.value : state[name] || '';
    const helpHTML = options.help ? helpButton(options.help, label) : '';
    let attrs = ' id="' + name + '" name="' + name + '" data-field="' + name + '"' + (options.required === false ? '' : ' required') + (options.maxlength ? ' maxlength="' + options.maxlength + '"' : '') + (options.inputmode ? ' inputmode="' + options.inputmode + '"' : '') + (options.autocomplete ? ' autocomplete="' + options.autocomplete + '"' : '') + (options.disabled ? ' disabled' : '') + ' aria-describedby="' + name + '-error' + (options.hint ? ' ' + name + '-hint' : '') + '"';
    let control;
    if (options.options) {
      control = '<select' + attrs + '>' + (options.placeholder ? '<option value="">' + esc(options.placeholder) + '</option>' : '') + options.options.map(item => '<option value="' + esc(item) + '"' + (item === value ? ' selected' : '') + '>' + esc(item) + '</option>').join('') + '</select>';
    } else if (options.multiline) {
      control = '<textarea' + attrs + ' rows="2" placeholder="' + esc(options.placeholder || '') + '">' + esc(value) + '</textarea>';
    } else {
      control = '<input type="' + (options.type || 'text') + '"' + attrs + ' value="' + esc(value) + '" placeholder="' + esc(options.placeholder || '') + '">';
    }
    return '<div class="field"><label for="' + name + '">' + esc(label) + (options.required === false ? '' : '<span class="required">*</span>') + helpHTML + '</label><div class="control">' + control + '</div>' + (options.hint ? '<p class="field-hint" id="' + name + '-hint">' + esc(options.hint) + '</p>' : '') + '<p class="field-error" id="' + name + '-error" hidden></p></div>';
  }
  function heading(text, note = '', extra = '') { return '<div class="screen-heading ' + extra + '"><h1 id="screen-title" tabindex="-1">' + text + '</h1>' + (note ? '<p class="heading-note">' + note + '</p>' : '') + '</div>'; }
  function button(text, action, cls = 'primary', disabled = false) { return '<button type="' + (action === 'next' ? 'submit' : 'button') + '" class="button ' + cls + '" data-action="' + action + '"' + (disabled ? ' disabled' : '') + '>' + text + '</button>'; }
  function footer(label, options = {}) {

      case 'reset':closeDialog();try{localStorage.removeItem(DRAFT_KEY);}catch(_){}if(objectURL)URL.revokeObjectURL(objectURL);objectURL='';storedDraft=null;savedMemory=null;receipt=null;state=model.initial();password='';confirmation='';code='';loginMode=false;returnToReview=false;uploadError='';navigate('citizenship');break;
      case 'clear-draft':openDialog('Delete this draft?','<p>This removes the saved draft from this device.</p>',button('Delete draft','delete-draft')+button('Cancel','close-dialog','secondary'));break;
      case 'delete-draft':closeDialog();try{localStorage.removeItem(DRAFT_KEY);}catch(_){}storedDraft=null;savedMemory=null;if(!receipt)state=model.initial();navigate('applications');break;
    }
  });
  window.addEventListener('popstate', event=>{
    const destination=event.state?.slas?event.state.screen:'citizenship';
    if(state.submitted&&!['applications','submitted','record'].includes(destination)){navigate('submitted',{fromHistory:true});return;}
    const requiresAccount=!registration.has(destination)&&destination!=='applications';
    navigate(requiresAccount&&!state.accountConfirmed?'citizenship':destination,{fromHistory:true});
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&busy){sequence++;busy=false;render();}});
  window.addEventListener('beforeunload',()=>{if(objectURL)URL.revokeObjectURL(objectURL);});
  if(storedDraft)state.screen='applications';
  history.replaceState({slas:true,screen:state.screen},'',location.pathname+location.search+'#'+state.screen);
  render();
}());
